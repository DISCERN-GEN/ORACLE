[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-private-platform"
version = "0.7.0.dev0"
description = "Private prediction-market intelligence and paper-execution platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "asyncpg>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "orjson>=3.10,<4",
  "websockets>=14,<16",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["oracle_platform*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set so results do not change with the ruff version's defaults.
# E501 is excluded: pre-v0.7 code has long lines; fixing them is churn without risk reduction.
select = ["E", "F", "I", "UP", "B", "BLE", "S110"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Intentional broad catches: the collector must never die on one bad frame or DB hiccup;
# every such handler preserves raw evidence and records invalidation.
"oracle_platform/collector.py" = ["BLE001", "S110"]
# Reviewed 2026-11-01: each handler records the error and continues (fail-visible), or fails
# closed (geoblock). None swallows silently. Narrowing them is tracked, not blocking.
"oracle_platform/agent.py" = ["BLE001"]
"oracle_platform/api.py" = ["BLE001"]
"oracle_platform/wallet_discovery.py" = ["BLE001"]
"scripts/*.py" = ["BLE001"]
